# Temporary: keeps the two newest releases and deletes the rest (tags stay).
# Runs once when this branch is pushed; the branch is then deleted.
name: cleanup-releases
on:
  push:
    branches: [cleanup-releases]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | [(.published_at // .created_at), .tag_name] | @tsv' | sort -r > all.tsv
          echo "Releases: $(wc -l < all.tsv)"
          echo "Keeping:"
          head -2 all.tsv
          tail -n +3 all.tsv | cut -f2 | while read -r tag; do
            gh release delete "$tag" --repo "$REPO" --yes && echo "deleted $tag"
          done
          echo "Left:"
          gh release list --repo "$REPO" --limit 10
