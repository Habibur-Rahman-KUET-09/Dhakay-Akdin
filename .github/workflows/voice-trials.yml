name: voice trials

# Lines marked as badly spoken, tried a few ways each (tool/voice_trials.json),
# onto the voice-trials branch to be heard and picked. By hand only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python3 tool/make_voice_trials.py "$RUNNER_TEMP/trials"
      - name: Push to voice-trials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/trials"
          git init -q -b voice-trials
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Voice trials"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" voice-trials
