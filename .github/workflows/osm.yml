name: osm

# Downloads an area's real streets from OpenStreetMap into tool/osm/ and
# commits them. Runs when tool/fetch_osm.py changes, or by hand.
on:
  push:
    branches: [main]
    paths: [tool/fetch_osm.py, .github/workflows/osm.yml]
  workflow_dispatch:
    inputs:
      area:
        description: Area id in tool/fetch_osm.py ("missing" for every area not yet fetched)
        default: missing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tool/fetch_osm.py "${{ github.event.inputs.area || 'missing' }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/osm
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "OpenStreetMap data for ${{ github.event.inputs.area || 'missing' }}"
          git push
