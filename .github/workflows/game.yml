name: game

# The 3D game (Godot): content check, rule tests, screenshots of the town,
# and an Android APK on a GitHub pre-release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT: 4.5.1-stable
  GODOT_TEMPLATES: 4.5.1.stable
  # Whether the web build can go to Firebase Hosting (a service account key).
  HAS_HOSTING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Content
        run: |
          pip install --quiet fonttools
          python3 tool/validate_content.py

      - name: Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version

      - name: Import
        run: godot --headless --path game --import 2>&1 | tee import.log

      # Fails on a failed test, and on any script error anywhere in the run.
      - name: Tests
        run: |
          set -o pipefail
          godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee test.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" test.log; then exit 1; fi

      - name: Screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          set -o pipefail
          xvfb-run -a -s "-screen 0 540x960x24" godot --path game --rendering-driver opengl3 \
            --resolution 540x960 -s res://tests/shots.gd -- "$PWD/dist" 2>&1 | tee shots.log
          if grep -E "SCRIPT ERROR|Parse Error" shots.log; then exit 1; fi
          ls -la dist

      - name: Version
        id: v
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: templates
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES }}
          key: godot-templates-${{ env.GODOT }}

      - name: Firebase settings
        # The online copy's project id and web API key, from the repository's
        # secrets, into the build (content/cloud.json, not in git). They end
        # up in the APK as with any Firebase app; Firestore's rules keep each
        # player to their own copy. Then a real round trip as a check.
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        continue-on-error: true
        run: |
          if [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_API_KEY" ]; then
            python3 tool/cloud_config.py game/content/cloud.json
            # Each outcome line as a notice on the run, easy to find.
            godot --headless --path game -s res://tests/cloud_check.gd 2>&1 | grep -E "^cloud:|SCRIPT ERROR" | sed 's/^/::notice title=Online backup::/' || true
          else
            echo "No Firebase secrets: the online copy is off in this build"
          fi

      - name: Export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o t.tpz "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_export_templates.tpz"
          unzip -q t.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/$GODOT_TEMPLATES
          rm t.tpz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Google sign-in plugin
        # The Android library for Google sign-in (android-plugin/), and
        # Godot's Android build template, which the Gradle build needs.
        run: |
          gradle -p android-plugin --no-daemon --quiet assembleRelease
          mkdir -p game/addons/google_sign_in/bin
          cp android-plugin/build/outputs/aar/GoogleSignIn-release.aar game/addons/google_sign_in/bin/
          rm -rf game/android && mkdir -p game/android/build
          unzip -q ~/.local/share/godot/export_templates/$GODOT_TEMPLATES/android_source.zip -d game/android/build
          printf '%s' "$GODOT_TEMPLATES" > game/android/.build_version
          touch game/android/build/.gdignore
          ls -la game/addons/google_sign_in/bin

      - name: APK
        if: github.event_name != 'pull_request'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/keys/dev.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/keys/dev.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          v=${{ steps.v.outputs.version }}
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          sed -i "s/^config\/version=.*/config\/version=\"$v\"/" game/project.godot
          sed -i "s/^version\/name=.*/version\/name=\"$v\"/; s/^version\/code=.*/version\/code=$((3000 + ${{ github.run_number }}))/" game/export_presets.cfg
          mkdir -p build dist
          set -o pipefail
          # One APK per processor family, so each is about half the size:
          # arm64-v8a for nearly every phone, armeabi-v7a for old ones.
          for abi in arm64-v8a armeabi-v7a; do
            other=$([ "$abi" = arm64-v8a ] && echo armeabi-v7a || echo arm64-v8a)
            sed -i "s/^architectures\/$abi=.*/architectures\/$abi=true/; s/^architectures\/$other=.*/architectures\/$other=false/" game/export_presets.cfg
            godot --headless --path game --export-release "Android" "$PWD/build/PranerDhaka-$v-$abi.apk" 2>&1 | tee "export-$abi.log"
            if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "export-$abi.log"; then exit 1; fi
            test -s "build/PranerDhaka-$v-$abi.apk"
            cp "build/PranerDhaka-$v-$abi.apk" dist/
          done
          ls -la dist

      # The same game for a browser, on Firebase Hosting (<project>.web.app)
      # when the repository has a service account key for it.
      - name: Web
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/web
          set -o pipefail
          godot --headless --path game --export-release "Web" "$PWD/build/web/index.html" 2>&1 | tee export-web.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" export-web.log; then exit 1; fi
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
          ls -la build/web
          # Also on the release, to try the web build without the site.
          (cd build/web && zip -qr "../../dist/PranerDhaka-web-${{ steps.v.outputs.version }}.zip" .)

      - name: Firebase Hosting
        if: github.event_name != 'pull_request' && env.HAS_HOSTING == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: প্রাণের ঢাকা ${{ steps.v.outputs.version }} (3D)
          prerelease: true
          body: |
            পরীক্ষামূলক 3D সংস্করণ। বেশিরভাগ ফোনে `arm64-v8a` APK-টা নামান; খুব পুরোনো ফোনে `armeabi-v7a`। সাথে খেলার কয়েকটা screenshot।
          files: dist/*
