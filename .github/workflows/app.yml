name: app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Text and numbers, including that the Bangla font can draw every character.
      - name: Content
        run: |
          pip install --quiet fonttools
          python3 tool/validate_content.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter test

      - name: Version
        id: v
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        if: github.event_name != 'pull_request'
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=BUILD_VERSION=${{ steps.v.outputs.version }}
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "dist/DhakarEkdin-${{ steps.v.outputs.version }}-$abi.apk"
          done
          ls -la dist

      # Test APKs go to a GitHub pre-release, not workflow artifacts (which use
      # the account's storage quota).
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ঢাকার একদিন ${{ steps.v.outputs.version }}
          prerelease: true
          body: |
            পরীক্ষামূলক সংস্করণ। বেশিরভাগ ফোনে `arm64-v8a` APK-টা নামান; পুরোনো ফোনে `armeabi-v7a`।
          files: app/dist/*
